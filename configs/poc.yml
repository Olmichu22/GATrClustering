# ============================================================
# POC - Unsupervised clustering of SDHCAL showers with GATr
# ------------------------------------------------------------
# The whole pipeline is parametric: feature routing (point / geometric scalar /
# GATr scalar input), per-feature scaling, and switchable aggregation.
# Changing detector/conditions = changing this YAML.
# ============================================================

data:
  path: /nfs/cms/arqolmo/SDHCAL_Energy/GATrClustering/data/E70GeV_2016.h5   # converted + anchored
  val_ratio: 0.2
  seed: 42
  filters: null            # optional: {field: value | ["<=X", ">=Y"]}

  # ----- field_map: logical names -> real h5 keys -----
  # FIXED structural contract (CSR): offsets + per-hit arrays + per-event arrays.
  # Branch NAMES are remappable here.
  field_map:
    offsets: offsets
    hit:
      x: x
      y: y
      z: z
      k: k              # layer index (collinear with z; use only one of the two)
      thr: thr
    event:
      energy: energy            # optional (may be missing)
      anchor_label: anchor_label   # -1 = no anchor, 0..K-1 = class (marked by the user)
      # particle_type is NOT ground truth (just another noisy classifier): it is
      # exported for inspection only and is NOT used for validation. Validation is
      # anchor-based (held-out anchors) + unsupervised (nHits/silhouette/occupancy).
      class_label: particle_type   # noisy, inspection only -- not used as GT
      nHits_total: null            # optional; if null, derived from offsets

  anchor_field: anchor_label     # per-event field with the anchor class
  eval_label_field: class_label  # per-event field with the true label (eval only)

# ----- Feature routing to multivector / GATr scalar input -----
features:
  mv_point: [x, y, z]      # -> embed_point (exactly 3 components)
  mv_scalar: []            # -> embed_scalar (geometric scalar; 0..n, summed; [] => 0)
  scalars: [thr]           # -> GATr SCALAR INPUT (in_s_channels), hit-level
  thr_encoding: ordinal    # ordinal (thr=1/2/3, 1 channel) | one_hot (thr1,thr2,thr3, 3 channels)
  extra_event_scalars: []  # e.g. [energy]; broadcast to hits, into the SAME GATr scalar input

# ----- Per-feature scaling -----
scaling:
  source: online           # online (compute+save) | file (read yaml) | dataset (already normalized)
  stats_path: null         # null -> <dataset>_stats.yml
  features:
    x: {mode: z_norm}      # z_norm | minmax | none | log
    y: {mode: z_norm}
    z: {mode: z_norm}
    k: {mode: minmax}
    thr: {mode: none}      # ordinal without scaling; one_hot is not scaled
    energy: {mode: log}

# ----- Model -----
model:
  encoder:
    hidden_mv_channels: 16
    hidden_s_channels: 64
    num_blocks: 4
    out_mv_channels: 1
    out_s_channels: 64
    dropout: 0.1
    mv_embedding_mode: centroid   # centroid (2 mv channels) | single (1 channel)
  aggregation:
    type: attention             # mean | attention | token
    num_seeds: 2           # (attention)
    num_heads: 4           # (attention / token)
    dropout: 0.0
  head:
    proj_dim: 64           # dimension d of the z space
    num_clusters: 3        # K (parametric: 2 e/pi, 3 e/pi/mu, ...)
    temperature: 0.1       # tau of the cosine similarity

# ----- Augmentation -----
augment:
  hit_dropout: 0.15        # hit dropout (10-15%)

# ----- Loss: L = L_swap + lambda_ce*CE(anchors) + lambda_vicreg*(var+cov)
#              + lambda_prior*KL(cluster_prior || mean assignment) -----
loss:
  lambda_ce: 5.0           # high at the start (anchors = most reliable signal)
  lambda_vicreg: 1.0
  swap:
    weight: 1.0
    sharpen_temp: 0.25
  vicreg:
    var_weight: 1.0
    cov_weight: 0.04
    var_gamma: 1.0         # per-dimension target std

  # ----- Cluster-proportion prior (anti-collapse) -----
  # Pulls the batch-mean soft assignment toward a target mix via KL(prior||p_bar),
  # forbidding any cluster from dying. Aligned to cluster index = anchor_label:
  # 0=electron, 1=pion, 2=muon (see configs/anchors.yml). Flexible baseline: it is
  # a *soft* prior (lambda controls the pull), not a hard constraint.
  cluster_prior: [0.04, 0.23, 0.73]   # [e, pi, mu]; null -> prior disabled
  lambda_prior: 0.5                    # 0/null -> disabled
  prior_ema: true                      # smooth p_bar across batches (on/off)
  prior_ema_momentum: 0.9              # EMA weight on history (only if prior_ema)
  # p_bar is estimated over UNLABELED events only (anchors excluded): anchors are
  # hand-picked / balanced and would bias p_bar toward uniform against the prior.
  prior_exclude_anchors: true

# ----- Training -----
train:
  epochs: 100
  batch_size: 256
  lr: 1.0e-3
  warmup_epochs: 10           # linear LR warmup before cosine (0 = disabled; recommended with multi-GPU / high lr)
  warmup_start_factor: 0.01  # lr starts at warmup_start_factor*lr and ramps to lr over warmup_epochs
  weight_decay: 1.0e-4
  device: cuda:0,1          # cuda:0 (1 GPU) | cuda:0,1 or gpu:N or cuda (all) -> multi-GPU DDP
  num_workers: 8
  seed: 42
  out_dir: results/poc_run1   # each job writes to out_dir/<timestamp>[_name]/checkpoints (never overwritten)
  plot_every: 5           # -> Trainer.check_val_every_n_epoch: run val (metric + latent-PCA) every N epochs
  plot_max_events: 3000   # cap events used for the training-time PCA plot
  # ----- Checkpointing (Lightning ModelCheckpoint) -----
  ckpt_monitor: val/heldout_anchor_acc   # metric monitored for "best" checkpoints (maximized)
  ckpt_save_top_k: 2                      # keep the top-K best-epoch checkpoints (best-epoch*.ckpt); last.ckpt always kept
  # ----- Early stopping (monitors val/loss, minimized) -----
  # NOTE: patience is counted in VALIDATION CHECKS, not epochs. Validation runs
  # every plot_every epochs, so patience=6 with plot_every=5 => stop after ~30
  # epochs without val/loss improvement. 0 (or null) disables early stopping.
  early_stop_patience: 10
  early_stop_min_delta: 0.0               # min val/loss decrease to count as an improvement
  # ----- Weights & Biases logging (like GATrAutoencoder) -----
  wandb:
    enabled: true
    project: gatr-clustering
    entity: null          # null -> your default W&B entity
    name: null            # run name; null -> W&B auto-generated
    mode: online          # online | offline | disabled

